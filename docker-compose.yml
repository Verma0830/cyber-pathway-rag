services:
  cyber-pathway-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyber-pathway-rag-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - LLM_PROVIDER=local
      # Optional: Add free Google Gemini API key if desired for cloud synthesis
      # - GEMINI_API_KEY=
      # Optional: Point to local Ollama instance
      # - OLLAMA_ENDPOINT=http://host.docker.internal:11434
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
